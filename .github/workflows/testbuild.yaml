# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
name: Debug deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GitHub container registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest
          file: ./Dockerfile
  deploy:
    needs: build 
    runs-on: ubuntu-latest
    steps:
    - name: Generate random port
      run: echo "PORT=$(( ( RANDOM % 10000 ) + 10001 ))" >> $GITHUB_ENV
    - name: Show random port
      run: echo "Random port is $PORT"
    - name: Repo name
      run: echo "REPO=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')" >>${GITHUB_ENV}
    - name: Deploy to VPS
      uses: YaCenturion/ssh-sh@v2
      with:
        # Target server hostname or IP address..
        HOST: ${{ secrets.VPS_IP }}
        PORT: 22
        # SSH username for authentication.
        USERNAME: ${{ secrets.VPS_USER }}
        SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        RUN_MAIN: |
          docker pull ghcr.io/costeranalytics/${{ env.REPO }}:latest
          docker stop ${{ env.REPO }} || true
          docker rm ${{ env.REPO }} || true
          cp /etc/nginx/sites-available/locations/default_location /etc/nginx/sites-enabled/locations/${{ env.REPO }}
          sed -i 's/__REPO__/${{ env.REPO }}/g' /etc/nginx/sites-enabled/locations/${{ env.REPO }}
          sed -i 's/__PORT__/${{ env.PORT }}/g' /etc/nginx/sites-enabled/locations/${{ env.REPO }}
          nginx -s reload          
          docker run --rm --name ${{ env.REPO }} --env PG_USER --env PG_HOST --env PG_PWD --env PG_DB -p ${{ env.PORT }}:8080 ghcr.io/costeranalytics/${{ env.REPO }}:latest
