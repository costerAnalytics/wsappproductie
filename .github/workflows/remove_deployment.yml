name: Remove deployed docker container from VPS

on:
  workflow_dispatch:

jobs:
  remove_deployment:
    runs-on: ubuntu-latest
    steps:
    - name: Repo name
      run: echo "REPO=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')" >>${GITHUB_ENV}
    - name: Undeploy from VPS
      uses: YaCenturion/ssh-sh@v2
      with:        
        HOST: ${{ secrets.VPS_IP }}
        PORT: 22
        USERNAME: ${{ secrets.VPS_USER }}
        SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        RUN_MAIN: |
          docker stop ${{ env.REPO }} || true
          docker rm ${{ env.REPO }} || true
          rm -f /etc/nginx/sites-enabled/locations/${{ env.REPO }}
          nginx -s reload
